<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GameZone - Sign In</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="login-body">

    <!-- CONTENITORE CENTRALE DEL LOGIN -->
    <main class="login-container">
        
        <!-- Logo del sito -->
        <div class="login-logo">
            <h1>⚡ GAMEZONE</h1>
            <p>Connect, Play, and Share Games</p>
        </div>

        <!-- Box del Form -->
        <div class="login-box">
            <h2>Sign In</h2>

            <!-- Form di accesso -->
            <form action="index.html" method="GET" id="login-form">
                
                <div class="input-group">
                    <label for="username">Sign in with account name</label>
                    <input type="text" id="username" name="username" placeholder="Gamertag or Email" required autocomplete="username">
                </div>

                <div class="input-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Password" required autocomplete="current-password">
                </div>

                <!-- Opzioni extra (es. Ricordami) -->
                <div class="form-options">
                    <label>
                        <input type="checkbox" name="remember"> Remember me
                    </label>
                    <a href="#forgot" class="forgot-link">Forgot password?</a>
                </div>

                <p id="error-message" class="error-msg-text"></p>

                <!-- Pulsante di Invio -->
                <button type="submit" class="btn-signin">Sign In</button>

            </form>

            <!-- Link per la registrazione -->
            <div class="register-prompt">
                <p>New to GameZone? <a href="register.html">Create an account</a></p>
            </div>
        </div>

    </main>

    <!-- FOOTER MINIMALE -->
    <footer>
        <p>&copy; 2026 GameZone Corporation. All rights reserved.</p>
    </footer>

    <!-- MODALE FORGOT PASSWORD -->
    <div id="forgot-modal" class="modal-overlay">
        <div class="modal-box">
            <h3 class="modal-title">Reset Password</h3>
            <div class="input-group modal-input-group">
                <label for="reset-username" class="modal-label">Account Name</label>
                <input type="text" id="reset-username" placeholder="Enter your username" class="modal-input">
            </div>
            <div class="input-group modal-input-group-last">
                <label for="reset-new-password" class="modal-label">New Password</label>
                <input type="password" id="reset-new-password" placeholder="Enter new password" class="modal-input">
            </div>
            <div class="modal-btn-group">
                <button type="button" id="submit-reset-btn" class="modal-confirm-btn">Confirm</button>
                <button type="button" id="close-reset-btn" class="modal-cancel-btn">Cancel</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>

</body>
</html>
