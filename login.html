<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GameZone - Sign In</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="login-body">

    <!-- CONTENITORE CENTRALE DEL LOGIN -->
    <main class="login-container">
        
        <!-- Logo del sito -->
        <div class="login-logo">
            <h1>⚡ GAMEZONE</h1>
            <p>Connect, Play, and Share Games</p>
        </div>

        <!-- Box del Form -->
        <div class="login-box">
            <h2>Sign In</h2>

            <!-- Form di accesso -->
            <form action="index.html" method="GET" id="login-form">
                
                <div class="input-group">
                    <label for="username">Sign in with account name</label>
                    <input type="text" id="username" name="username" placeholder="Gamertag or Email" required autocomplete="username">
                </div>

                <div class="input-group">
                    <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Password" required autocomplete="current-password">
                </div>

                <!-- Opzioni extra (es. Ricordami) -->
                <div class="form-options">
                    <label>
                        <input type="checkbox" name="remember"> Remember me
                    </label>
                    <a href="#forgot" class="forgot-link">Forgot password?</a>
                </div>

                <p id="error-message" style="margin-top: 10px; font-weight: bold;"></p>

                <!-- Pulsante diInvio (per ora punta direttamente a index.html) -->
                <button type="submit" class="btn-signin">Sign In</button>

            </form>

            <!-- Link per la registrazione -->
            <div class="register-prompt">
                <p>New to GameZone? <a href="register.html">Create an account</a></p>
            </div>
        </div>

    </main>

    <!-- FOOTER MINIMALE -->
    <footer>
        <p>&copy; 2026 GameZone Corporation. All rights reserved.</p>
    </footer>

<!-- MODALE FORGOT PASSWORD PERSONALIZZATA -->
    <div id="forgot-modal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); justify-content: center; align-items: center; z-index: 1000;">
        <div style="background: #1b2838; border: 1px solid #2a475e; padding: 30px; border-radius: 8px; width: 350px; box-shadow: 0 8px 24px rgba(0,0,0,0.5);">
            <h3 style="color: #66c0f4; margin-bottom: 15px;">Reset Password</h3>
            <div class="input-group" style="margin-bottom: 15px;">
                <label for="reset-username" style="color: #c7d5e0; font-size: 0.9rem; display: block; margin-bottom: 5px;">Account Name</label>
                <input type="text" id="reset-username" placeholder="Enter your username" style="width: 100%; padding: 10px; background: #323f4d; border: 1px solid #10141b; color: white; border-radius: 4px;">
            </div>
            <div class="input-group" style="margin-bottom: 20px;">
                <label for="reset-new-password" style="color: #c7d5e0; font-size: 0.9rem; display: block; margin-bottom: 5px;">New Password</label>
                <input type="password" id="reset-new-password" placeholder="Enter new password" style="width: 100%; padding: 10px; background: #323f4d; border: 1px solid #10141b; color: white; border-radius: 4px;">
            </div>
            <div style="display: flex; gap: 10px;">
                <button type="button" id="submit-reset-btn" style="flex: 1; background: #2a475e; color: #66c0f4; border: 1px solid #66c0f4; padding: 10px; border-radius: 4px; font-weight: bold; cursor: pointer;">Confirm</button>
                <button type="button" id="close-reset-btn" style="flex: 1; background: #3b1d1d; color: #ff4d4d; border: 1px solid #ff4d4d; padding: 10px; border-radius: 4px; font-weight: bold; cursor: pointer;">Cancel</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>

</body>
</html>
